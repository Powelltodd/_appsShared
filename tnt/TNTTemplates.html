<!-- TNTTemplates.html — the shared <template> set for every TNT screen.
     A near-verbatim copy of Team/toTNTTemplates.html (56 templates).

     It is copied rather than restyled because these templates emit the
     private se-/ta- class namespaces, which tnt.css (beside this file)
     restyles for Bootstrap 5 — that is the whole point of the
     one-renderer/two-skins approach. Change markup here only when the
     old file changes; keep the two in step.

     SHARED by apps/LiveMeet and apps/ttJudgeScoring. Loaded ONCE into
     body-level #lmTntTemplates by each app's TNT loader.
     ssLoadTable/ssLoadSection look these up by bare id, so a second copy
     anywhere on the page would create duplicate ids and silently bind the
     wrong one. -->
